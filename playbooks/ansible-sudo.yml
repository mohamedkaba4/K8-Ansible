---
- name: Configure passwordless sudo
  hosts: k8s
  become: true

  tasks:
    - name: Allow mkaba passwordless sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-ansible
        content: "mkaba ALL=(ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: '0440'
        validate: '/usr/sbin/visudo -cf %s'
