---
- name: Configure Tailscale IPs on all Kubernetes VMs
  hosts: k8s
  become: true
  serial: 1

  tasks:
    - name: Verify Tailscale interface
      ansible.builtin.command: tailscale ip -4
      register: tailscale_ip
      changed_when: false

    - name: Configure kubelet node IP
      ansible.builtin.lineinfile:
        path: /etc/default/kubelet
        regexp: '^KUBELET_EXTRA_ARGS='
        line: "KUBELET_EXTRA_ARGS=--node-ip={{ tailscale_ip.stdout | trim }}"
        create: true
        mode: '0644'
      register: kubelet_ip_config

    - name: Check whether kubelet is initialized
      ansible.builtin.stat:
        path: /var/lib/kubelet/config.yaml
      register: kubelet_initialized

    - name: Restart initialized kubelet
      ansible.builtin.systemd_service:
        name: kubelet
        state: restarted
      when:
        - kubelet_initialized.stat.exists
        - kubelet_ip_config.changed
